name: Release Build
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Yaran-2.0-amd64-minimal.json
            runner: ubuntu-latest
            artifact: yaran-amd64-minimal
          - config: Yaran-2.0-amd64-extended.json
            runner: ubuntu-latest
            artifact: yaran-amd64-extended
    uses: ./.github/workflows/image.yml
    with:
      config: ${{ matrix.config }}
      runner: ${{ matrix.runner }}
      artifact: ${{ matrix.artifact }}
      release: true
