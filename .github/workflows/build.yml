name: Build & Validate Yaran Linux

on:
  push:
    branches: [main]
    paths:
      - 'Yaran*.json'
      - 'build.py'
      - 'hooks/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'assets/**'
      - 'yaran.svg'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Yaran*.json'
      - 'build.py'
      - 'hooks/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'assets/**'
      - 'yaran.svg'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests and manifests
        run: |
          python3 -m unittest discover -s tests -v
          for config in Yaran*.json examples/*.json; do
            python3 build.py "$config" --validate
          done
          find hooks scripts -name '*.sh' -exec bash -n {} \;

  build-desktop:
    needs: validate
    uses: ./.github/workflows/image.yml
    with:
      config: Yaran-2.1-amd64-sway-minimal.json
      runner: ubuntu-latest
      artifact: yaran-amd64-sway-minimal-2.1.1
